name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        ports: ["5432:5432"]
        env:
          POSTGRES_DB: kasir_test
          POSTGRES_USER: kasir
          POSTGRES_PASSWORD: kasir
        options: >-
          --health-cmd="pg_isready -U kasir -d kasir_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, redis, mbstring, xml, curl, zip, intl, bcmath, pcntl
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress --no-interaction

      # .env is gitignored, so key:generate has nothing to write to.
      - name: Prepare environment
        working-directory: backend
        run: cp .env.example .env

      - name: Generate key
        working-directory: backend
        run: php artisan key:generate

      - name: Run migrations
        working-directory: backend
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: kasir_test
          DB_USERNAME: kasir
          DB_PASSWORD: kasir

      # phpunit.xml already pins CACHE_DRIVER/SESSION_DRIVER/QUEUE_CONNECTION to
      # array/sync; PHPUnit does not override variables that already exist in the
      # environment, so setting them here would take the tests off their
      # in-memory configuration.
      #
      # Coverage is 65.8% (measured 2026-10-16, 74 tests). The 50% floor is the
      # original project target and is now comfortably met.
      - name: Run tests with coverage
        working-directory: backend
        run: php artisan test --coverage --min=50
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: kasir_test
          DB_USERNAME: kasir
          DB_PASSWORD: kasir
          BROADCAST_DRIVER: 'null'

  backend-lint:
    name: Backend Lint (Pint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, mbstring, xml, curl, zip
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Pint
        working-directory: backend
        run: php vendor/bin/pint --test

  firmware-build:
    name: Firmware Build
    runs-on: ubuntu-latest
    # Not continue-on-error: a firmware that does not compile must fail the build.
    # platformio.ini uses the PlatformIO board id nodemcuv2, which is the NodeMCU
    # v3 / ESP-12E module.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        working-directory: firmware
        run: pio run -e nodemcuv2

  e2e-cypress:
    name: E2E (Cypress)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, mbstring, xml, curl, zip
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress --no-interaction

      # E2E runs against a fresh SQLite database so the suite is deterministic.
      - name: Prepare environment
        working-directory: backend
        run: |
          cp .env.example .env
          touch database/database.sqlite
          sed -i 's/^DB_CONNECTION=pgsql/DB_CONNECTION=sqlite/' .env
          sed -i "s|^DB_DATABASE=.*|DB_DATABASE=$(pwd)/database/database.sqlite|" .env
          sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env

      - name: Generate key
        working-directory: backend
        run: php artisan key:generate

      - name: Run migrations and seed demo data
        working-directory: backend
        run: php artisan migrate:fresh --seed --force
        env:
          DB_CONNECTION: sqlite
          BROADCAST_DRIVER: 'null'

      # Cypress specs mock the transaction API and Livewire polling, so the
      # HTTP server is enough; Reverb is not started here.
      - name: Cache config, routes and views
        working-directory: backend
        run: php artisan optimize
        env:
          DB_CONNECTION: sqlite
          BROADCAST_DRIVER: 'null'

      - name: Start Laravel server
        working-directory: backend
        run: |
          PHP_CLI_SERVER_WORKERS=4 nohup php artisan serve --host=127.0.0.1 --port=8000 > /tmp/laravel-serve.log 2>&1 &
          echo $! > /tmp/laravel-serve.pid
          disown
        env:
          DB_CONNECTION: sqlite
          BROADCAST_DRIVER: 'null'

      - name: Wait for server
        run: |
          for i in $(seq 1 60); do
            status=$(curl -s -o /tmp/login.html -w '%{http_code}' http://127.0.0.1:8000/login || true)
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 1
          done
          echo "GET /login returned $status"
          head -c 3000 /tmp/login.html || true
          echo
          tail -n 60 storage/logs/laravel.log || true
          exit 1
        working-directory: backend

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cypress
        run: npm ci

      - name: Run Cypress (admin + kasir)
        run: npx cypress run

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [backend-test, backend-lint, e2e-cypress]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploy to staging server"
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}