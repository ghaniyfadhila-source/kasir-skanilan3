; PlatformIO Project Configuration for ESP8266 NodeMCU v3
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    ; RFID
    MFRC522@^1.4.12
    ; LCD I2C
    LiquidCrystal_I2C@^1.1.4
    ; JSON
    bblanchon/ArduinoJson@^7.0.4
    ; WebSocket
    WebSockets@^2.7.3
    ; HTTP Client
    arduino-libraries/ArduinoHttpClient@^0.6.0
    ; WiFi Manager
    tzapu/WiFiManager@^2.0.11-rc.1

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1

board_build.flash_mode = dio
board_build.f_cpu = 80000000L