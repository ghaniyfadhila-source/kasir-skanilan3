; PlatformIO Project Configuration for ESP8266 NodeMCU v3
[env:nodemcuv3]
platform = espressif8266
board = nodemcuv3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    ; RFID
    miguelbalboa/RFID@^4.0.0
    ; LCD I2C
    marco-c/LiquidCrystal_I2C@^1.1.2
    ; JSON
    bblanchon/ArduinoJson@^7.0.4
    ; WebSocket
    links2004/arduinoWebSockets@^2.6.1
    ; HTTP Client
    arduino-libraries/ArduinoHttpClient@^0.6.0
    ; WiFi Manager
    tzapu/WiFiManager@^2.0.11-rc.1

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1

board_build.flash_mode = dio
board_build.f_cpu = 80000000L